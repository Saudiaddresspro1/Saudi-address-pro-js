name: Publish npm package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out package repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Set up npm with Trusted Publishing support
        run: npm install --global npm@11 --registry=https://registry.npmjs.org
      - name: Validate release identity and version
        run: node .github/scripts/check-release.cjs
      - name: Install locked dependencies
        run: npm ci
      - name: Build existing package source
        run: npm run build
      - name: Verify package contents and entry points
        run: node .github/scripts/check-package.cjs
      - name: Publish to npm using OIDC
        run: |
          DIST_TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          npm publish --access public --tag "$DIST_TAG"
